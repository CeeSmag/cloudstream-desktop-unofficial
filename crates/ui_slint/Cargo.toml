[package]
name = "ui_slint"
description = "CloudStream desktop UI (Slint): screens, theme, navigation, player chrome."
edition.workspace = true
version.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Wayland pulls in `calloop`, which enables `tracing/log` on Linux and inflates
# `clippy::cognitive_complexity`. Default builds keep both X11 and Wayland (same as
# `slint/backend-default`); `--no-default-features` drops Wayland so Linux can check
# `cognitive_complexity` across the whole workspace.
default = ["wayland"]
wayland = ["slint/backend-winit-wayland"]

[dependencies]
app_services = { path = "../app_services" }
app_updater = { path = "../app_updater" }
cloudflare_bridge = { path = "../cloudflare_bridge" }
core_model = { path = "../core_model" }
memory_budget = { path = "../memory_budget" }
open = "5"
playback_session = { path = "../playback_session" }
poster_artwork = { path = "../poster_artwork" }
player_api = { path = "../player_api" }
skip_times = { path = "../skip_times" }
subtitle_store = { path = "../subtitle_store" }
title_cache = { path = "../title_cache" }
# Slint's defaults minus `system-tray`: the app has no tray icon, and the tray pulls in `ksni`
# (Unlicense, not on the license list). `backend-winit-x11` + default `wayland` == `backend-default`.
slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "unstable-fontique-012",
] }
tracing.workspace = true

[build-dependencies]
slint-build = "1.19"

[lints]
workspace = true
