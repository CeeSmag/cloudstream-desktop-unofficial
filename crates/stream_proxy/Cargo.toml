[package]
name = "stream_proxy"
description = "A small local HTTP proxy that lets the player open HLS streams from hosts it cannot play from directly (they refuse Range requests), with the provider's headers on every request."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
ureq = "3"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"

[[bench]]
name = "hls_rewrite"
harness = false

[lints]
workspace = true
