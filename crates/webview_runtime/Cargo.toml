[package]
name = "webview_runtime"
description = "Finds the Microsoft Edge WebView2 Runtime and installs it with Microsoft's own setup."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
ureq = "3"

[target.'cfg(windows)'.dependencies]
# Microsoft's safe registry API (windows-rs). winsafe 0.0.19 cannot read the runtime's `pv`: EdgeUpdate
# writes it without a terminating NUL, which winsafe's RegGetValue/RegQueryValueEx refuse.
windows-registry = "=0.6.1"

[lints]
workspace = true
