[package]
name = "app_shell"
description = "Wiring only: builds the real implementations and starts the app."
edition.workspace = true
version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "cloudstream"
path = "src/main.rs"

[features]
# ui_slint is a dependency without its default features, so each of them is passed on here: a release
# build (`cargo build -p app_shell`) gets only what this list names.
default = ["wayland", "pointer-hiding"]
wayland = ["ui_slint/wayland"]
# The pointer hides with the player's controls (`ui_slint::bridge::cursor_sync`).
pointer-hiding = ["ui_slint/pointer-hiding"]

[dependencies]
anyhow.workspace = true
app_services = { path = "../app_services" }
app_updater = { path = "../app_updater" }
cloudflare_bridge = { path = "../cloudflare_bridge" }
core_model = { path = "../core_model" }
extension_api = { path = "../extension_api" }
extension_repo = { path = "../extension_repo" }
extension_runtime = { path = "../extension_runtime" }
memory_budget = { path = "../memory_budget" }
player_api = { path = "../player_api" }
player_mpv = { path = "../player_mpv" }
poster_artwork = { path = "../poster_artwork" }
skip_times = { path = "../skip_times" }
storage = { path = "../storage" }
stream_proxy = { path = "../stream_proxy" }
subtitle_store = { path = "../subtitle_store" }
# RAM and core count for the Auto performance profile; the "system" feature only (no network, disks, users).
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
title_cache = { path = "../title_cache" }
tracing.workspace = true
tracing-subscriber.workspace = true
ui_slint = { path = "../ui_slint", default-features = false }
webview_runtime = { path = "../webview_runtime" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
