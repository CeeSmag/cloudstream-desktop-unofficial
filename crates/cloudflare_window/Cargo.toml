[package]
name = "cloudflare_window"
description = "cloudstream-verify: the browser window in which the viewer passes a site's Cloudflare check."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "cloudstream-verify"
path = "src/main.rs"

[dependencies]
cloudflare_bridge = { path = "../cloudflare_bridge" }
serde_json.workspace = true
serde.workspace = true
url = "=2.5.9"
# The browser window. A separate process, so the WebView's event loop never runs inside Slint's.
tao = "=0.37.2"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
wry = { version = "=0.57.1", default-features = false, features = ["os-webview", "x11"] }
webkit2gtk = { version = "=2.0.2", default-features = false, features = ["v2_40"] }
soup3 = "=0.5.0"

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.19", features = ["user"] }
# The published 0.100.0 API needs an unsafe HWND attachment. This revision provides a checked,
# asynchronous host constructor while keeping native navigation and protocol subscriptions.
windows-webview = { git = "https://github.com/microsoft/windows-rs", rev = "d1ee6f58a8d713edf908d68538b54b7c61ab97b2", default-features = false }

[lints]
workspace = true
