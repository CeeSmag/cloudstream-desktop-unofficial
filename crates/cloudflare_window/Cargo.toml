[package]
name = "cloudflare_window"
description = "cloudstream-verify: the browser window in which the viewer passes a site's Cloudflare check."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "cloudstream-verify"
path = "src/main.rs"

[dependencies]
cloudflare_bridge = { path = "../cloudflare_bridge" }
serde_json.workspace = true
# The browser window. A separate process, so the WebView's event loop never runs inside Slint's.
tao = "=0.37.2"
tracing.workspace = true
tracing-subscriber.workspace = true
wry = { version = "=0.57.1", default-features = false, features = ["os-webview", "x11"] }

# Same pin as wry: ignore TLS errors in the verify profile so a self-signed redirect host
# (e.g. parked domain) does not freeze the window on WebKit's "Unacceptable TLS certificate".
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", default-features = false, features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.19", features = ["user"] }

[lints]
workspace = true
