[package]
name = "cloudflare_bridge"
description = "Sidecar Cloudflare challenge file exchange without a main WebView shell."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = "=2.5.9"

[features]
# Cross-platform test helper binary used by this crate's T2 integration tests.
test-support = []

[[bin]]
name = "fake_verify_helper"
path = "src/bin/fake_verify_helper.rs"
required-features = ["test-support"]

[dev-dependencies]
cloudflare_bridge = { path = ".", features = ["test-support"] }
proptest = "1"
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.19", features = ["user"] }

[lints]
workspace = true
