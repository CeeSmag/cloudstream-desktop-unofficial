[package]
name = "extension_runtime"
description = "Runs extensions out-of-process and exposes them through the ProviderGateway trait."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
core_model = { path = "../core_model" }
extension_api = { path = "../extension_api" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true

[features]
# Test doubles (a scripted link search, a fake sidecar) used by this and other crates' tests.
test-support = []

[[bin]]
name = "fake_sidecar"
path = "src/bin/fake_sidecar.rs"
required-features = ["test-support"]

[dev-dependencies]
extension_runtime = { path = ".", features = ["test-support"] }
ureq = { version = "3.5.1", features = ["json"] }
