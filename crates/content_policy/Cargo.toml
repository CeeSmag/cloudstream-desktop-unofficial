[package]
name = "content_policy"
description = "Decides whether a CloudStream plugin is a video plugin, the only kind the app supports. Pure, no I/O."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# The `plugin-content-policy` command (JSON in, JSON out) that tools/extension_recorder calls, so the
# tool and the app share this one implementation.
cli = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[[bin]]
name = "plugin-content-policy"
path = "src/bin/plugin_content_policy.rs"
required-features = ["cli"]

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
