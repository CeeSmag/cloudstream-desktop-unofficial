name: Quality & Deep QA (Coverage, Mutation, Metrics, Fuzz, Bench)

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Workspace Coverage (cargo-llvm-cov)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage & enforce thresholds
        run: bash scripts/coverage.sh --show-gaps 25

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/coverage/lcov.info
            target/coverage/summary.json
            target/coverage/html/

  mutants-pr-diff:
    name: Mutation Testing (PR Diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutate PR diff
        run: bash scripts/run_mutants.sh --diff "origin/${{ github.base_ref }}"

      - name: Upload PR mutation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-pr-diff
          path: target/mutants/diff/

  mutants-nightly:
    name: Mutation Testing (Core Crates)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate:
          - core_model
          - skip_times
          - title_cache
          - subtitle_store
          - stream_proxy
          - playback_session
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutate ${{ matrix.crate }}
        run: bash scripts/run_mutants.sh --crate "${{ matrix.crate }}"

      - name: Upload mutation outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.crate }}
          path: target/mutants/${{ matrix.crate }}/

  metrics-and-static:
    name: Quality Metrics, Unsafe Audit, Fuzz & Bench Sanity
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            shellcheck

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-geiger & cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger,cargo-machete

      - name: Architecture & Unsafe Audit
        run: |
          python3 scripts/check_architecture.py
          python3 scripts/check_unsafe_audit.py

      - name: Cargo Geiger Summary
        run: cargo geiger --output-format Ascii --all-features --quiet || true

      - name: Quality Metrics Report
        run: |
          python3 scripts/quality_metrics.py --markdown-out target/quality/metrics.md
          cat target/quality/metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fuzz Corpus Sanity
        run: bash scripts/run_fuzz_sanity.sh

      - name: Hot-Path Benchmarks Sanity
        run: |
          cargo bench -p subtitle_store --bench subtitle_normalize -- --quick
          cargo bench -p app_services --bench link_ranking -- --quick
          cargo bench -p stream_proxy --bench hls_rewrite -- --quick

      - name: Upload quality metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics
          path: target/quality/
