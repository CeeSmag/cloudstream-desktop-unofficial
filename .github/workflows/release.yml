name: Release build

# Builds every release file on GitHub's machines:
#   Windows x64   installer + single-file portable exe   (scripts/build_release.ps1)
#   Linux x86_64  AppImage                               (scripts/build_release.sh)
#   Linux aarch64 AppImage                               (scripts/build_release.sh, on a native ARM runner)
# Windows is x64 only: Windows on ARM runs it through emulation, and the updater picks the Windows
# file by name alone (setup.exe / portable.exe), so a second Windows CPU needs CPU matching there first.
#
# Run it by hand (Actions tab > Release build > Run workflow) to get the files as downloadable artifacts,
# or push a tag like v0.3.4 to also collect them into a DRAFT release. Nothing is published until
# you press "Publish" on the draft. The draft also carries SHA256SUMS and SHA256SUMS.minisig, signed
# with the secrets MINISIGN_SECRET_KEY and MINISIGN_PASSWORD; without them no draft is made. Files
# from a manual run are not signed (the app refuses them as updates; fine for trying a build).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (installer + portable)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NSIS
        run: |
          choco install nsis -y
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (Test-Path (Join-Path $nsisDir 'makensis.exe')) {
            $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & (Join-Path $nsisDir 'makensis.exe') /VERSION
          } else {
            makensis /VERSION
          }

      - name: Build the extension sidecar
        run: ./scripts/setup_sidecar.ps1 -Jdk21 $env:JAVA_HOME

      - name: Build installer and portable exe
        run: ./scripts/build_release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*-setup.exe
            dist/*_portable.exe
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 12 keeps the glibc requirement low, so the AppImage runs on most distros.
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: bash scripts/build_release.sh --install-deps

      - name: Build the AppImage
        run: bash scripts/build_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For scripts/sign_release.sh and the app's public key it checks the signature against.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # The app installs an update only when SHA256SUMS is signed with the owner's key
      # (signed SHA256SUMS for app_updater). The script fails when a secret is missing or
      # does not match crates/app_updater/update_signing_key.pub, so no unsigned draft is made.
      - name: Write and sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash scripts/sign_release.sh --require-signature files

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; leaving it as it is."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" files/* \
            --repo "${{ github.repository }}" --draft --prerelease \
            --title "CloudStream RS ${{ github.ref_name }}" \
            --notes "Draft created by the Release build workflow. Edit the notes, then publish."
