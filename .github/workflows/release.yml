name: Release build

# Builds every release file on GitHub's machines:
#   Windows x64   installer + single-file portable exe   (scripts/build_release.ps1)
#   Linux x86_64  AppImage                               (scripts/build_release.sh)
#   Linux aarch64 AppImage                               (scripts/build_release.sh, on a native ARM runner)
#
# Run it by hand (Actions tab > Release build > Run workflow) to get the files as downloadable artifacts,
# or push a tag like v0.3.4 to also collect them into a DRAFT release. Nothing is published until
# you press "Publish" on the draft.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (installer + portable)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the extension sidecar
        run: ./scripts/setup_sidecar.ps1 -Jdk21 $env:JAVA_HOME

      - name: Install frontend packages
        working-directory: crates/desktop_tauri/frontend
        run: npm ci

      - name: Build installer and portable exe
        run: ./scripts/build_release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*-setup.exe
            dist/*_portable.exe
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 12 keeps the glibc requirement low, so the AppImage runs on most distros.
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: bash scripts/build_release.sh --install-deps

      - name: Build the AppImage
        run: bash scripts/build_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; leaving it as it is."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" files/* \
            --repo "${{ github.repository }}" --draft \
            --title "CloudStream RS ${{ github.ref_name }}" \
            --notes "Draft created by the Release build workflow. Edit the notes, then publish."
