name: CI

# The same checks as `just gates` (justfile) and RULES.md section 8: change all three together.
#   Windows: fmt, clippy, tests      Linux: clippy, tests (compiles the Unix-only code)
#   cargo deny + cargo audit         file lengths (scripts/check_file_lengths.py)
#   sidecar tests
# Weekly, only the advisory checks run again, so a new advisory shows up without a push.
# Product UI is Slint (ui_slint + app_shell); the archived Tauri frontend is not part of product CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust (Format, Clippy & Tests)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace

  rust-linux:
    name: Rust on Linux (Clippy & Tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # A hung test would otherwise hold the runner for GitHub's 6-hour limit.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Slint (GTK + X11/Wayland) and WebKitGTK 4.1 for the Cloudflare helper (cloudflare_window).
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # Without cognitive_complexity: on Linux a Wayland dependency (calloop) turns on `tracing/log`,
      # every tracing macro then expands to an extra `log` branch, and clippy counts those as the
      # function's own complexity. The `--no-default-features` pass below checks it on Linux too.
      - name: Clippy Warnings (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::cognitive_complexity

      - name: Clippy Warnings (strict cognitive_complexity)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Rustdoc Broken Intra-Doc Links
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links" cargo doc --workspace --no-deps

      - name: Workspace Tests (unit, integration, race, property, Slint, BDD)
        run: cargo test --workspace

  supply-chain:
    name: Licenses & Advisories (cargo deny, cargo audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: cargo deny (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  project-rules:
    name: Project Rules (lengths, arch, unsafe, machete, shellcheck)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Setup Rust toolchain (for cargo metadata)
        uses: dtolnay/rust-toolchain@stable

      - name: Test QA & rule scripts
        run: python3 -m unittest discover -s scripts -p "*_test.py"

      - name: Rust files within 300 lines (RULES.md section 4)
        run: python3 scripts/check_file_lengths.py

      - name: One-way crate architecture & 0 cycles (RULES.md section 2)
        run: python3 scripts/check_architecture.py

      - name: Unsafe allowlist & SAFETY comments (RULES.md section 8)
        run: python3 scripts/check_unsafe_audit.py

      - name: Unused dependencies (cargo machete)
        run: |
          mapfile -t MEMBERS < <(python3 -c 'import tomllib; print("\n".join(tomllib.load(open("Cargo.toml","rb"))["workspace"]["members"]))')
          cargo machete "${MEMBERS[@]}"

      - name: Shell script lint (shellcheck)
        run: shellcheck scripts/*.sh

  sidecar-check:
    name: Sidecar (Kotlin & Gradle)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Sidecar Bridge
        run: powershell -ExecutionPolicy Bypass -File .\scripts\setup_sidecar.ps1 -Root C:\cs3d

      - name: Test Sidecar Tests
        run: powershell -ExecutionPolicy Bypass -File .\scripts\test_sidecar.ps1 -Root C:\cs3d
