name: CI

# The same checks as `just gates` (justfile) and RULES.md section 8: change all three together.
#   Windows: fmt, clippy, tests      Linux: clippy, tests (compiles the Unix-only code)
#   cargo deny + cargo audit         file lengths (scripts/check_file_lengths.py)
#   frontend tests + build           sidecar tests
# Weekly, only the advisory checks run again, so a new advisory shows up without a push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust (Format, Clippy & Tests)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace

  rust-linux:
    name: Rust on Linux (Clippy & Tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # A hung test would otherwise hold the runner for GitHub's 6-hour limit.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Tauri/WebKitGTK build packages, as in scripts/build_release.sh --install-deps.
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config             libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Clippy Warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace

  supply-chain:
    name: Licenses & Advisories (cargo deny, cargo audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: cargo deny (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  project-rules:
    name: Project Rules (file lengths)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test the check
        run: python3 -m unittest discover -s scripts -p "*_test.py"

      - name: Rust files within 300 lines (RULES.md section 4)
        run: python3 scripts/check_file_lengths.py

  frontend-check:
    name: Frontend (Vitest & Build)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: crates/desktop_tauri/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop_tauri/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests (Vitest)
        run: npm test

      - name: TypeCheck and Build (Vite)
        run: npm run build

  sidecar-check:
    name: Sidecar (Kotlin & Gradle)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Sidecar Bridge
        run: powershell -ExecutionPolicy Bypass -File .\scripts\setup_sidecar.ps1 -Root C:\cs3d

      - name: Test Sidecar Tests
        run: powershell -ExecutionPolicy Bypass -File .\scripts\test_sidecar.ps1 -Root C:\cs3d
