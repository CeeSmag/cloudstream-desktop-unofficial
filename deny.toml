# Only the platforms we ship: crates used on other targets (iOS, Android, wasm) are not checked.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates pulled in by egui/eframe; there is no upgrade path yet.
# Revisit when eframe moves off them. `cargo audit` reports no vulnerabilities.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, transitive via egui text rendering" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, transitive via accesskit (Linux D-Bus only)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, transitive via accesskit (Linux D-Bus only)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, transitive via accesskit (Linux D-Bus only)" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, transitive via glib-macros in tauri (Linux)" },
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained (not vulnerable), required by i-slint-core 1.19; revisit with the next Slint release" },
    { id = "RUSTSEC-2026-0542", reason = "humantime: unmaintained (not vulnerable), dev-only via cucumber BDD harness" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: unmaintained (not vulnerable), via spin_on in slint-build / slint-macros at build time" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
# The pinned WebView2 binding provides safe attachment to the native verification window.
allow-git = ["https://github.com/microsoft/windows-rs"]
