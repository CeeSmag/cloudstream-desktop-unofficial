[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates pulled in by egui/eframe; there is no upgrade path yet.
# Revisit when eframe moves off them. `cargo audit` reports no vulnerabilities.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, transitive via egui text rendering" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, transitive via accesskit (Linux D-Bus only)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, transitive via accesskit (Linux D-Bus only)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, transitive via accesskit (Linux D-Bus only)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
