[workspace]
resolver = "2"
members = [
    "crates/core_model",
    "crates/extension_api",
    "crates/extension_runtime",
    "crates/extension_repo",
    "crates/player_api",
    "crates/player_mpv",
    "crates/storage",
    "crates/subtitle_store",
    "crates/skip_times",
    "crates/stream_proxy",
    "crates/title_cache",
    "crates/app_services",
    "crates/app_updater",
    "crates/playback_session",
    "crates/poster_artwork",
    "crates/memory_budget",
    "crates/ui_slint",
    "crates/app_shell",
    "crates/portable_launcher",
    "crates/cloudflare_bridge",
    "crates/cloudflare_window",
    "tests/bdd",
]
# `archive/desktop_tauri` is the former WebView shell — kept for reference, not a workspace member.
# `crates/ui_app` (egui) is reference-only too: its font provider turns on fontconfig `dlopen`,
# which breaks Slint's `fontique` when both are built in one workspace run.
# `fuzz` uses nightly libFuzzer crates and runs standalone via `cargo fuzz` / `scripts/run_fuzz_sanity.sh`.
exclude = ["crates/ui_app", "fuzz"]

[workspace.package]
edition = "2021"
version = "0.5.2"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# The CPU frame conversion in the embedded player is slow without optimisation.
[profile.dev.package.player_mpv]
opt-level = 3
